name: scan
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node src/run.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_LAT: ${{ vars.HOME_LAT || secrets.HOME_LAT }}
          HOME_LNG: ${{ vars.HOME_LNG || secrets.HOME_LNG }}
          RADIUS_KM: ${{ vars.RADIUS_KM || secrets.RADIUS_KM }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_MAX_ITEMS: ${{ vars.APIFY_MAX_ITEMS || secrets.APIFY_MAX_ITEMS }}
          APIFY_BUDGET_USD: ${{ vars.APIFY_BUDGET_USD || secrets.APIFY_BUDGET_USD }}
          APIFY_STOP_AT_PCT: ${{ vars.APIFY_STOP_AT_PCT || secrets.APIFY_STOP_AT_PCT }}
          FB_LOCATION: ${{ vars.FB_LOCATION || secrets.FB_LOCATION }}
          FB_RADIUS_KM: ${{ vars.FB_RADIUS_KM || secrets.FB_RADIUS_KM }}
          FB_MAX_ITEMS: ${{ vars.FB_MAX_ITEMS || secrets.FB_MAX_ITEMS }}
          WATCH: ${{ vars.WATCH || secrets.WATCH }}
          SOURCES: ${{ vars.SOURCES || secrets.SOURCES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug/, if-no-files-found: ignore }
