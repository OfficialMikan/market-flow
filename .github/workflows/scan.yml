name: scan
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node src/run.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_LAT: ${{ vars.HOME_LAT || secrets.HOME_LAT }}
          HOME_LNG: ${{ vars.HOME_LNG || secrets.HOME_LNG }}
          RADIUS_KM: ${{ vars.RADIUS_KM || secrets.RADIUS_KM }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_MAX_ITEMS: ${{ vars.APIFY_MAX_ITEMS || secrets.APIFY_MAX_ITEMS }}
          APIFY_BUDGET_USD: ${{ vars.APIFY_BUDGET_USD || secrets.APIFY_BUDGET_USD }}
          APIFY_STOP_AT_PCT: ${{ vars.APIFY_STOP_AT_PCT || secrets.APIFY_STOP_AT_PCT }}
          FB_GROUPS: ${{ vars.FB_GROUPS || secrets.FB_GROUPS }}
          GROUP_MAX_POSTS: ${{ vars.GROUP_MAX_POSTS || secrets.GROUP_MAX_POSTS }}
          GROUP_HOURS: ${{ vars.GROUP_HOURS || secrets.GROUP_HOURS }}
          QUERIES_PER_RUN: ${{ vars.QUERIES_PER_RUN || secrets.QUERIES_PER_RUN }}
          DETAIL_TOP_N: ${{ vars.DETAIL_TOP_N || secrets.DETAIL_TOP_N }}
          TRAVEL_PESO_PER_KM: ${{ vars.TRAVEL_PESO_PER_KM || secrets.TRAVEL_PESO_PER_KM }}
          CATEGORIES: ${{ vars.CATEGORIES || secrets.CATEGORIES }}
          NEAR_KM: ${{ vars.NEAR_KM || secrets.NEAR_KM }}
          FAR_KM: ${{ vars.FAR_KM || secrets.FAR_KM }}
          HAGGLE_PCT: ${{ vars.HAGGLE_PCT || secrets.HAGGLE_PCT }}
          FEE_PCT: ${{ vars.FEE_PCT || secrets.FEE_PCT }}
          DETAIL_MAX: ${{ vars.DETAIL_MAX || secrets.DETAIL_MAX }}
          VISION_TOP_N: ${{ vars.VISION_TOP_N || secrets.VISION_TOP_N }}
          GEOCODE_CAP: ${{ vars.GEOCODE_CAP || secrets.GEOCODE_CAP }}
          DISCOVER_DAYS: ${{ vars.DISCOVER_DAYS || secrets.DISCOVER_DAYS }}
          DISCOVER_EVAL: ${{ vars.DISCOVER_EVAL || secrets.DISCOVER_EVAL }}
          MAX_GROUPS: ${{ vars.MAX_GROUPS || secrets.MAX_GROUPS }}
          DISCOVER_ACTOR: ${{ vars.DISCOVER_ACTOR || secrets.DISCOVER_ACTOR }}
          GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL || secrets.GROQ_VISION_MODEL }}
          OPENROUTER_VISION_MODEL: ${{ vars.OPENROUTER_VISION_MODEL || secrets.OPENROUTER_VISION_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          FB_LOCATION: ${{ vars.FB_LOCATION || secrets.FB_LOCATION }}
          FB_RADIUS_KM: ${{ vars.FB_RADIUS_KM || secrets.FB_RADIUS_KM }}
          FB_MAX_ITEMS: ${{ vars.FB_MAX_ITEMS || secrets.FB_MAX_ITEMS }}
          WATCH: ${{ vars.WATCH || secrets.WATCH }}
          SOURCES: ${{ vars.SOURCES || secrets.SOURCES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug/, if-no-files-found: ignore }
