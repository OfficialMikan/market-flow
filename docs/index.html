<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Flow</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1b2d"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f5;--s:#fff;--ink:#0f1b2d;--mu:#566782;--ln:#d6dde8;--ac:#2540d9;--acs:#e4e9ff;--gn:#0b8a5f;--gns:#dcf4ea;--ls:#c4351f;--lss:#fde7e3;--tg:#ffd43b;--tgi:#2a2100;--ws:#fff3d6;--wi:#8a5a00;--sh:rgba(15,27,45,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--s:#131b2e;--ink:#e8edf7;--mu:#93a1ba;--ln:#243049;--ac:#8fa4ff;--acs:#1c2850;--gn:#4ade9a;--gns:#12342a;--ls:#ff8a75;--lss:#3b1b16;--ws:#3a2c0a;--wi:#ffd98a;--sh:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.pr,.num{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:0 14px 110px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 10px;background:var(--bg)}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}.sub{color:var(--mu);font-size:13px}
h2{font-size:18px;margin:22px 0 4px;font-weight:800}h3{font-size:15px;margin:18px 0 6px;font-weight:800}.hint{color:var(--mu);font-size:13px;margin:0 0 10px}
.btn{border:1px solid var(--ln);background:var(--s);border-radius:99px;padding:7px 14px;font-weight:500;font-size:13.5px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}@media (prefers-color-scheme:dark){.btn.pri{color:#0b1120}}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.row>*{flex:none}
.note{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--ws);color:var(--wi);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 4px}
.tile{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.tile .num{font-size:22px;font-weight:800;display:block}.tile small{color:var(--mu);font-size:12.5px}
.tools{display:flex;gap:8px;margin:4px 0 8px}input,select,textarea{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}.tools input{flex:1}
.list{display:grid;gap:12px;margin-top:8px}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px;cursor:pointer;align-content:start}
.pic{height:84px;border-radius:10px;background:var(--acs);display:grid;place-items:center;font-size:34px;position:relative;overflow:hidden}.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rank{position:absolute;left:4px;top:4px;z-index:1;background:var(--ink);color:var(--bg);font:800 11px Archivo,sans-serif;border-radius:6px;padding:1px 6px}
.ttl{font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mu);font-size:12.5px;margin:3px 0}
.meta span{display:inline-flex;align-items:center;gap:4px}.meta svg{width:13px;height:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:1px 8px;background:var(--acs);color:var(--ac);margin:0 4px 4px 0}
.chip.up{background:var(--gns);color:var(--gn)}.chip.warn{background:var(--ws);color:var(--wi)}.chip.bad{background:var(--lss);color:var(--ls)}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip div{line-height:1.15}.strip small{display:block;color:var(--mu);font-size:12px}.pr{font-size:19px;font-weight:800}
.arrow{width:22px;height:22px;color:var(--mu);flex:none}
.net{margin-left:auto;background:var(--tg);color:var(--tgi);font:800 16px Archivo,sans-serif;padding:5px 12px 5px 18px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.net.neg{background:var(--lss);color:var(--ls)}
.spread{grid-column:1/-1;display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ln)}.spread i{background:var(--ink)}.spread u{background:var(--mu);opacity:.5}.spread b{background:var(--tg)}
.foot{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}.foot .btn{padding:4px 11px;font-size:12.5px;margin-left:auto}
.foot .btn+.btn{margin-left:0}
.fl{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13.5px}.fl:last-child{border:0}.fl small{color:var(--mu)}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.panel{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:4px 14px}
.ag{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}.ag b{display:block;overflow-wrap:anywhere}.ag span{color:var(--mu);font-size:12.5px}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:10px 0}.form input:first-child,.form button{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}textarea,.sett input{width:100%}.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--s);border-radius:99px;padding:5px 12px;color:var(--ink);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:150px;border:0;background:none;padding:9px 2px 8px;color:var(--mu);display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav button[aria-current=page]{color:var(--ac);font-weight:600}
.veil{position:fixed;inset:0;background:var(--sh);z-index:8}
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:760px){.sheet{left:auto;top:0;width:480px;max-height:none;border-radius:0;animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .x{float:right}.gal{margin:8px 0}.gal .main{aspect-ratio:4/3;border-radius:14px;background:var(--acs);display:grid;place-items:center;font-size:56px;overflow:hidden}.gal img.big{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.thumbs img{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid transparent;cursor:pointer;flex:none}.thumbs img[aria-current=true]{border-color:var(--ac)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}.kv b{font-family:Archivo,sans-serif}.kv .tot{border-top:1px solid var(--ln);padding-top:6px;margin-top:2px;font-weight:600}
.msg{width:100%;min-height:92px;font-size:14px}.trust{display:inline-block;min-width:34px;text-align:center;font:800 13px Archivo,sans-serif;border-radius:7px;padding:1px 8px}
.spark{width:100%;height:46px}.spark polyline{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}
details summary{cursor:pointer;color:var(--ac);font-size:13.5px}
</style></head>
<body><div class="app">
<header class="top"><div><h1>Market Flow</h1><div class="sub" id="upd">Loading…</div></div><button class="btn pri" id="scanBtn">Scan now</button></header>
<div id="msg"></div>
<main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div class="veil" id="veil" hidden></div><aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Listing preview" hidden></aside>
<script src="config.js"></script>
<script>
const C=window.MF_CONFIG||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso=v=>v==null||isNaN(v)?"?":(v<0?"-":"")+"₱"+Math.abs(Math.round(v)).toLocaleString("en-PH");
const num=v=>v==null||v===""?null:(isFinite(+v)?+v:null);
const mins=iso=>iso?Math.max(0,Math.round((Date.now()-new Date(iso))/6e4)):null;
const ago=iso=>{const m=mins(iso);return m==null?"":m<60?m+" min ago":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago"};
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"";
const EMO={"Phones":"📱","Tablets & Wearables":"⌚","Laptops":"💻","Desktops & Parts":"🖥️","Monitors":"🖵","Peripherals":"⌨️","Audio":"🎧","Gaming":"🎮","Cameras & Drones":"📷","Networking & Storage":"💾","Smart Home & Power":"🔌","Printers & 3D":"🖨️","Other":"📦"};
const BASIS={buyer:"a buyer is asking",sold:"recent sold prices",asking:"current asking prices",ai:"an AI estimate"},CONF={A:["Buyer found","up"],B:["Sold comps","up"],C:["Market comps",""],D:["Estimate","warn"]};
const IC={flips:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',buy:'<path d="M3 12V4h8l9 9-8 8-9-9z"/><path d="M7.5 7.5h.01"/>',sell:'<path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 2.6 4 3 4 1.3 4 3-1.8 3-4 3-4-1.3-4-3"/>',profit:'<path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/>'};
const NAV=[["flips","Flips"],["buy","Buy"],["sell","Sell"],["profit","Profit"],["settings","Settings"]];
let ALL=[],GONE=0,VIEW="flips",cat="All",QS="",SORT="score",F={profit:false,fresh:false,saved:false,drops:false},ST={},TR=[],PRIV={},PASS="",DEMO=/[?&]demo/.test(location.search);
try{ST=JSON.parse(localStorage.getItem("mf-saved")||"{}");TR=JSON.parse(localStorage.getItem("mf-trades")||"[]");PASS=localStorage.getItem("mf-pass")||""}catch(e){}
const LV=+(localStorage.getItem("mf-visit")||Date.now()-3*36e5);
document.addEventListener("visibilitychange",()=>{if(document.hidden)try{localStorage.setItem("mf-visit",Date.now())}catch(e){}});
const saveTR=()=>{try{localStorage.setItem("mf-trades",JSON.stringify(TR))}catch(e){}};
const note=t=>{$("msg").innerHTML=t?'<div class="note">'+t+'</div>':""};
const H=()=>({apikey:C.anonKey,Authorization:"Bearer "+C.anonKey}),API=()=>(C.url||"").replace(/\/$/,"");
const sells=()=>ALL.filter(x=>x.intent!=="wanted"),wants=()=>ALL.filter(x=>x.intent==="wanted");
const isNew=x=>+new Date(x.first_seen)>LV;
const svg=(n,c)=>`<svg viewBox="0 0 24 24" class="${c||""}" aria-hidden="true">${IC[n]}</svg>`;
const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const clock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const arrow='<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function spread(x){
  if(!x.sell_price||!x.price)return"";
  const sell=x.sell_price,fees=Math.round(sell*.08),tr=x.travel_cost||0,tot=Math.max(sell,x.price+fees+tr),p=v=>Math.max(0,v/tot*100).toFixed(1);
  return `<div class="spread" role="img" aria-label="Of ${peso(sell)}, ${peso(x.price)} is your cost, ${peso(fees+tr)} fees and travel, ${peso(sell-x.price-fees-tr)} profit"><i style="width:${p(x.price)}%"></i><u style="width:${p(fees+tr)}%"></u><b style="width:${p(sell-x.price-fees-tr)}%"></b></div>`}
function netTag(x){return x.net_profit==null?"":`<span class="net${x.net_profit<=0?" neg":""}" title="Expected profit after fees and travel">${x.net_profit>0?"+":""}${peso(x.net_profit)}</span>`}
function where(x){const a=x.area||x.location_text||"";return (a?`<span>${pin}${esc(a)}</span>`:"")+(x.distance_km!=null?`<span>${x.distance_km} km away</span>`:"")+`<span>${clock}${esc(ago(x.posted_at||x.first_seen))}</span>`}
function tags(x){let t="";if(isNew(x))t+='<span class="chip warn">New</span>';if(x.price_drop_pct>0)t+=`<span class="chip up">Down ${x.price_drop_pct}%</span>`;const c=CONF[x.confidence];if(c)t+=`<span class="chip ${c[1]}">${c[0]}</span>`;if(x.kind==="post")t+='<span class="chip">Group post</span>';return t}
function pic(x,i){const im=safeUrl(x.image_url);return `<div class="pic">${EMO[x.category]||"📦"}${im?`<img src="${esc(im)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}${i!=null?`<span class="rank">#${i+1}</span>`:""}</div>`}
function card(x,i){
  const w=x.intent==="wanted",buyers=(x.matches||[]).length;
  return `<article class="card" data-open="${esc(x.hash)}"><div>${pic(x,i)}</div><div><div class="ttl">${esc(x.title)}</div><div class="meta">${where(x)}</div><div>${tags(x)}</div></div>
${w?`<div class="strip"><div><small>Buyer's budget</small><b class="pr">${x.price?peso(x.price):"not stated"}</b></div>${netTag(x)}</div>`:`<div class="strip"><div><small>Buy at</small><b class="pr">${peso(x.price)}</b></div>${x.sell_price?arrow+`<div><small>Sell at</small><b class="pr">${peso(x.sell_price)}</b></div>`:""}${netTag(x)}</div>${spread(x)}`}
<div class="foot"><span>${w?(buyers?buyers+" seller"+(buyers>1?"s":"")+" can fill this":"No seller found yet"):(buyers?buyers+" buyer"+(buyers>1?"s":"")+" asking":"No buyer asking yet")}${!w&&x.sell_days?" · sells in ~"+Math.round(x.sell_days)+" d":""}</span><button class="btn" data-act="save" data-h="${esc(x.hash)}">${ST[x.hash]?"Saved":"Save"}</button></div></article>`}
const cats=rows=>["All",...[...new Set(rows.map(x=>x.category||"Other"))]];
const chipRow=rows=>`<div class="row" data-role="cats">${cats(rows).map(c=>`<button class="btn" data-cat="${esc(c)}" aria-pressed="${c==cat}">${esc(c)}</button>`).join("")}</div>`;
function filtered(rows){return rows.filter(x=>(cat=="All"||(x.category||"Other")==cat)&&(x.title||"").toLowerCase().includes(QS)&&(!F.profit||x.net_profit>0)&&(!F.fresh||isNew(x))&&(!F.saved||ST[x.hash])&&(!F.drops||x.price_drop_pct>0))}
const SORTS={score:x=>-x.score,net:x=>-(x.net_profit??-1e9),margin:x=>-(x.margin_pct??-1e9),demand:x=>-x.demand,dist:x=>x.distance_km==null?1e9:x.distance_km,new:x=>mins(x.first_seen),drop:x=>-(x.price_drop_pct||0)};
function products(){
  const g={};sells().forEach(x=>{const k=x.name||x.title;(g[k]??={name:k,cat:x.category,rows:[],asks:0}).rows.push(x)});
  wants().forEach(w=>{if(g[w.name])g[w.name].asks++});
  return Object.values(g).map(p=>{const pos=p.rows.filter(r=>r.net_profit>0),avg=a=>a.reduce((s,r)=>s+(r.net_profit||0),0)/(a.length||1),dem=p.rows.reduce((s,r)=>s+r.demand,0)/p.rows.length;
    return {...p,count:p.rows.length,flips:pos.length,avgNet:avg(pos),best:Math.max(0,...p.rows.map(r=>r.net_profit||0)),demand:Math.round(dem),days:(p.rows.find(r=>r.sell_days)||{}).sell_days,score:avg(pos)*(.5+dem/100)+p.asks*100}}).filter(p=>p.flips>0).sort((a,b)=>b.score-a.score)}
const prodRow=p=>`<div class="fl"><b>${esc(p.name)}</b><div><div class="bar"><i style="width:${p.demand}%"></i></div><small>demand ${p.demand}${p.days?" · sells in ~"+Math.round(p.days)+" d":""}${p.asks?" · "+p.asks+" buyer"+(p.asks>1?"s":"")+" asking":""}</small></div><small>${p.flips} flip${p.flips>1?"s":""} · avg ${peso(p.avgNet)}</small></div>`;

function vFlips(){
  const fl=sells().filter(x=>x.net_profit>0),best=fl.reduce((m,x)=>Math.max(m,x.net_profit),0),L=filtered(fl).sort((a,b)=>SORTS.score(a)-SORTS.score(b)),pr=products().slice(0,5);
  return `<div class="tiles"><div class="tile"><span class="num">${best?peso(best):"-"}</span><small>best profit on one flip</small></div><div class="tile"><span class="num">${fl.length}</span><small>flips worth doing</small></div><div class="tile"><span class="num">${wants().length}</span><small>buyers asking</small></div><div class="tile"><span class="num">${GONE}</span><small>sold or removed (48 h)</small></div></div>
<h2>Top products to flip</h2><p class="hint">Ranked by profit per item, demand and open buyer requests.</p>${pr.length?`<div class="panel">${pr.map(prodRow).join("")}</div>`:'<div class="empty">Nothing profitable yet. Run a scan, or open this page with ?demo to preview.</div>'}
<h2>Best flips right now</h2><p class="hint">Buy from the seller, sell to the buyer or at the market price. Profit is after 8% fees and travel.</p>${chipRow(fl)}<div class="list">${L.length?L.slice(0,40).map(card).join(""):'<div class="empty">No flips match.</div>'}</div>`}
function vBuy(){
  const L=filtered(sells()).sort((a,b)=>SORTS[SORT](a)-SORTS[SORT](b));
  return `<h2>Buy</h2><p class="hint">Every listing and group post for sale near you.</p>${chipRow(sells())}
<div class="tools"><input id="q" type="search" placeholder="Search items" aria-label="Search items" value="${esc(QS)}"><select id="sort" aria-label="Sort by">${[["score","Best flip"],["net","Most profit"],["margin","Best return"],["demand","Highest demand"],["dist","Nearest"],["new","Newest"],["drop","Biggest price drop"]].map(o=>`<option value="${o[0]}"${o[0]==SORT?" selected":""}>${o[1]}</option>`).join("")}</select></div>
<div class="row">${[["profit","Profitable only"],["fresh","New since last visit ("+sells().filter(isNew).length+")"],["drops","Price drops"],["saved","Saved"]].map(o=>`<button class="btn" data-f="${o[0]}" aria-pressed="${F[o[0]]}">${o[1]}</button>`).join("")}</div>
<div class="list">${L.length?L.slice(0,100).map((x,i)=>card(x,i)).join(""):'<div class="empty">'+(ALL.length?"No items match these filters.":"Connected, but no listings are saved yet. Run the scanner, then refresh.")+'</div>'}</div>`}
const sim=(a,b)=>{const A=new Set(String(a).toLowerCase().split(/\W+/).filter(Boolean)),B=new Set(String(b).toLowerCase().split(/\W+/).filter(Boolean));const i=[...A].filter(t=>B.has(t)).length;return i/(A.size+B.size-i||1)};
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length?(s.length%2?s[m]:(s[m-1]+s[m])/2):null};
function vSell(){
  const W=filtered(wants()).sort((a,b)=>b.score-a.score),stock=TR.filter(t=>t.sell==null),pr=products();
  const stockRows=stock.map(t=>{const m=sells().filter(x=>sim(t.item,x.name||x.title)>=.4).map(x=>x.sell_price||x.price),md=med(m);return `<div class="ag"><div><b>${esc(t.item)}</b><span>${md?`Market about ${peso(md)} from ${m.length} listing${m.length>1?"s":""}. List at ${peso(Math.round(md*.97/50)*50)}. You paid ${peso(t.buy)}.`:"No comparable listings yet. You paid "+peso(t.buy)+"."}</span></div></div>`}).join("");
  return `<h2>Sell</h2><p class="hint">Who wants to buy, what is in demand, and what to list your own stock at.</p>
<h3>Buyers asking near you</h3>${chipRow(wants())}<div class="list">${W.length?W.slice(0,40).map(card).join(""):'<div class="empty">No "wanted" posts yet. Add public Facebook groups in Settings.</div>'}</div>

    const rows=(await r.json()).map(x=>({...x,price:num(x.price),sell_price:num(x.sell_price),net_profit:num(x.net_profit),margin_pct:num(x.margin_pct),distance_km:num(x.distance_km),sell_days:num(x.sell_days),travel_cost:num(x.travel_cost),offer_price:num(x.offer_price),price_drop_pct:num(x.price_drop_pct)||0,intent:x.intent||"sell",specs:x.specs||[],issues:x.issues||[],images:x.images||[],matches:x.matches||[]}));
    GONE=rows.filter(x=>x.removed_at).length;ALL=rows.filter(x=>!x.removed_at);
    if(!CUR&&!document.querySelector("#main input:focus, #main textarea:focus"))note("");render();
  }catch(e){note("Could not load data ("+esc(e.message)+"). Check the URL and anon key, and that schema.sql and the migrations were run.")}}
render();load();setInterval(()=>{if(!CUR&&VIEW!="settings"&&VIEW!="profit")load()},60000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
