<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co https://api.github.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Market Flow</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1b2d"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f5;--s:#fff;--ink:#0f1b2d;--mu:#566782;--ln:#d6dde8;--ac:#2540d9;--acs:#e4e9ff;--gn:#07704c;--bd:#76849b;--gns:#dcf4ea;--ls:#c4351f;--lss:#fde7e3;--tg:#ffd43b;--tgi:#2a2100;--ws:#fff3d6;--wi:#8a5a00;--sh:rgba(15,27,45,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--s:#131b2e;--ink:#e8edf7;--mu:#93a1ba;--ln:#243049;--ac:#8fa4ff;--acs:#1c2850;--gn:#4ade9a;--bd:#667593;--gns:#12342a;--ls:#ff8a75;--lss:#3b1b16;--ws:#3a2c0a;--wi:#ffd98a;--sh:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.pr,.num{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:0 14px 110px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 10px;background:var(--bg)}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}.sub{color:var(--mu);font-size:13px}
h2{font-size:18px;margin:22px 0 4px;font-weight:800}h3{font-size:15px;margin:18px 0 6px;font-weight:800}.hint{color:var(--mu);font-size:13px;margin:0 0 10px}
.btn{border:1px solid var(--bd);background:var(--s);border-radius:99px;padding:7px 14px;font-weight:500;font-size:13.5px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}@media (prefers-color-scheme:dark){.btn.pri{color:#0b1120}}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.row>*{flex:none}
.note{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--ws);color:var(--wi);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 4px}
.tile{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.tile .num{font-size:22px;font-weight:800;display:block}.tile small{color:var(--mu);font-size:12.5px}
.tools{display:flex;gap:8px;margin:4px 0 8px}input,select,textarea{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0}.tools input{flex:1}
.list{display:grid;gap:12px;margin-top:8px}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px;cursor:pointer;align-content:start}
.pic{height:84px;border-radius:10px;background:var(--acs);display:grid;place-items:center;font-size:34px;position:relative;overflow:hidden}.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rank{position:absolute;left:4px;top:4px;z-index:1;background:var(--ink);color:var(--bg);font:800 11px Archivo,sans-serif;border-radius:6px;padding:1px 6px}
.lk{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;font-weight:600;color:var(--ink);display:inline}
.ttl{font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mu);font-size:12.5px;margin:3px 0}
.meta span{display:inline-flex;align-items:center;gap:4px}.meta svg{width:13px;height:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:1px 8px;background:var(--acs);color:var(--ac);margin:0 4px 4px 0}
.chip.up{background:var(--gns);color:var(--gn)}.chip.warn{background:var(--ws);color:var(--wi)}.chip.bad{background:var(--lss);color:var(--ls)}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip div{line-height:1.15}.strip small{display:block;color:var(--mu);font-size:12px}.pr{font-size:19px;font-weight:800}
.arrow{width:22px;height:22px;color:var(--mu);flex:none}
.net{margin-left:auto;background:var(--tg);color:var(--tgi);font:800 16px Archivo,sans-serif;padding:5px 12px 5px 18px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.net.neg{background:var(--lss);color:var(--ls)}
.spread{grid-column:1/-1;display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ln)}.spread i{background:var(--ink)}.spread u{background:var(--mu);opacity:.5}.spread b{background:var(--tg)}
.foot{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}.foot .btn{padding:4px 11px;font-size:12.5px;margin-left:auto}
.foot .btn+.btn{margin-left:0}
.fl{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13.5px}.fl:last-child{border:0}.fl small{color:var(--mu)}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.panel{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:4px 14px}
.ag{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}.ag b{display:block;overflow-wrap:anywhere}.ag span{color:var(--mu);font-size:12.5px}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:10px 0}.form input:first-child,.form button{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}textarea,.sett input{width:100%}.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--s);border-radius:99px;padding:5px 12px;color:var(--ink);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:150px;border:0;background:none;padding:9px 2px 8px;color:var(--mu);display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav button[aria-current=page]{color:var(--ac);font-weight:600}
.veil{position:fixed;inset:0;background:var(--sh);z-index:8}
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:760px){.sheet{left:auto;top:0;width:480px;max-height:none;border-radius:0;animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .x{float:right}.gal{margin:8px 0}.gal .main{aspect-ratio:4/3;border-radius:14px;background:var(--acs);display:grid;place-items:center;font-size:56px;overflow:hidden}.gal img.big{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.thumbs img{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid transparent;cursor:pointer;flex:none}.thumbs img[aria-current=true]{border-color:var(--ac)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}.kv b{font-family:Archivo,sans-serif}.kv .tot{border-top:1px solid var(--ln);padding-top:6px;margin-top:2px;font-weight:600}
.msg{width:100%;min-height:92px;font-size:14px}.trust{display:inline-block;min-width:34px;text-align:center;font:800 13px Archivo,sans-serif;border-radius:7px;padding:1px 8px}
.spark{width:100%;height:46px}.spark polyline{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}
details summary{cursor:pointer;color:var(--ac);font-size:13.5px}
.map{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);margin:10px 0;background:var(--acs)}.leaflet-container{font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two input{width:100%}
.inl{display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:10px}.inl input{width:auto}
.place{cursor:pointer}.place:hover{background:var(--acs)}.sett h3{margin-top:22px}.tr{display:grid;gap:8px;margin-top:10px}.tr select,.tr input{width:100%}
.fl.place{grid-template-columns:120px 1fr auto}.bi{display:block}.bi details{margin-top:2px}
</style></head>
<body><div class="app">
<header class="top"><div><h1>Market Flow</h1><div class="sub" id="upd">Loading…</div></div><button class="btn pri" id="scanBtn">Scan now</button></header>
<div id="msg" role="status" aria-live="polite"></div>
<main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div class="veil" id="veil" hidden></div><aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Listing preview" hidden></aside>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
<script src="app.js" defer></script>
</body></html>
